# One proxy, two ports: a client and its executors see one host per backend; /v2/ is the registry.
worker_processes 1;
error_log /logs/error.log warn;
# Each proxied gRPC stream holds an upstream connection: uploading a 100000-file set opens thousands at once,
# and with 1024 connections or descriptors nginx answered ByteStream/Write with 500 (V-31).
worker_rlimit_nofile 65536;
events { worker_connections 32768; }
http {
  log_format j escape=json '{"t":"$time_iso8601","proto":"$server_protocol","method":"$request_method","uri":"$request_uri","status":$status,"req_bytes":$request_length,"sent_bytes":$bytes_sent,"body_sent":$body_bytes_sent,"ctype":"$content_type","port":"$server_port"}';
  access_log /logs/access.json j;
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_buffering off;
  resolver 127.0.0.11 valid=5s;

  # Buildbarn: h2c (gRPC) and HTTP/1.1 on one cleartext port, routed by path.
  server {
    listen 80;
    http2 on;
    location /v2/ { proxy_http_version 1.1; proxy_pass http://zot:5000; }
    location / {
      set $bb frontend;
      grpc_pass grpc://$bb:8980;
      grpc_read_timeout 3600s; grpc_send_timeout 3600s;
      grpc_buffer_size 4m;
    }
  }

  # NativeLink. The upstream name is a variable so nginx starts without the nativelink profile.
  server {
    listen 82;
    http2 on;
    location /v2/ { proxy_http_version 1.1; proxy_pass http://zot:5000; }
    location / {
      set $nl nativelink;
      grpc_pass grpc://$nl:50051;
      grpc_read_timeout 3600s; grpc_send_timeout 3600s;
      grpc_buffer_size 4m;
    }
  }
}
