# https://taskfile.dev — dev toolchain provisioned via ocx (see ocx.toml)
version: "3"

includes:
  baseline:
    taskfile: ./taskfiles/baseline.taskfile.yml
    flatten: true
  rig:
    taskfile: ./taskfiles/rig.taskfile.yml
  guard:
    taskfile: ./taskfiles/guard.taskfile.yml

vars:
  # bazelisk lives in both the test and build groups (the verify-basic test and build jobs pull one each).
  BAZEL: ocx exec -g test -- bazelisk
  BAZEL_BUILD: ocx exec -g build -- bazelisk
  EXAMPLES: examples/project examples/package examples/cross_platform
  # Bazel versions the deep tier covers; rolling is forward-compat early warning only (never blocks).
  BAZEL_VERSIONS: 9.x
  # Remote-cache tuning (--config=ci) only on CI; a laptop keeps its own output base settings.
  CI_CFG:
    sh: if [ -n "${CI:-}" ]; then echo --config=ci; fi

tasks:
  default:
    deps: [verify]

  verify:
    desc: Full gate — lint, workflow lint, basic-tier tests, example workspaces, site build
    cmds:
      - task: ci:lint
      - task: workflows:lint
      - task: ci:test
      - task: test:examples
      - task: site:check

  # --- baseline ci:* entry points (verify-basic / verify-deep call these) ---

  ci:lint:
    desc: Lint and format check (buildifier, license headers, links, dist snapshot, guards)
    cmds:
      - task: lint
      - task: guard:check
      - task: guard:test

  # The template-owned workflows cannot carry a step for the ocx build under test, so the Bazel tasks start with
  # this one. No e2e/rbe/ocx-under-test.txt: it does nothing.
  ocx-under-test:
    desc: Point the Bazel runs at the ocx build in e2e/rbe/ocx-under-test.txt (no file, no effect)
    cmds:
      - bash scripts/ocx_under_test.sh

  ci:test:
    desc: Basic-tier Bazel tests (--config=basic); JUnit copied to target/reports/junit/
    cmds:
      - task: ocx-under-test
      - defer: { task: junit:collect, vars: { DIR: ".", PREFIX: basic } }
      - "{{.BAZEL}} test --config=basic {{.CI_CFG}} --verbose_test_summary -- //..."
      - task: test:install-binary
      - task: test:no-runfiles
        if: '{{eq OS "linux"}}'

  ci:build:
    desc: Build every Bazel target
    cmds:
      - task: ocx-under-test
      - "{{.BAZEL_BUILD}} build {{.CI_CFG}} -- //..."

  ci:docs:
    desc: Site build and checks, budget unit test and the Lighthouse gate
    cmds:
      - task: site:check
      - task: site:test
      - task: site:lighthouse

  ci:deep:
    desc: Nightly tier — full tests per Bazel version, examples, BCR parity, offline determinism
    cmds:
      - for: { var: BAZEL_VERSIONS }
        task: deep:test
        vars: { BAZEL_VERSION: "{{.ITEM}}" }
      - task: deep:test
        vars: { BAZEL_VERSION: rolling }
        ignore_error: true
      # Before deep:examples: the copies below are taken while the examples hold no bazel-* links.
      - task: deep:windows-runfiles
        if: '{{eq OS "windows"}}'
      - task: deep:windows-update-target
        if: '{{eq OS "windows"}}'
      - task: deep:examples
      - task: deep:bcr-parity
      - task: deep:offline

  deep:test:
    internal: true
    env:
      USE_BAZEL_VERSION: "{{.BAZEL_VERSION}}"
    cmds:
      - task: ocx-under-test
      - defer: { task: junit:collect, vars: { DIR: ".", PREFIX: "deep-{{.BAZEL_VERSION}}" } }
      - "{{.BAZEL}} test --config=deep {{.CI_CFG}} --verbose_test_summary -- //..."

  # Live ocx.sh registry.
  deep:examples:
    internal: true
    cmds:
      - for: { var: EXAMPLES }
        task: deep:example
        vars: { EXAMPLE: "{{.ITEM}}", BAZEL_VERSION: 9.x }

  deep:example:
    internal: true
    env:
      USE_BAZEL_VERSION: "{{.BAZEL_VERSION}}"
    cmds:
      - defer: { task: junit:collect, vars: { DIR: "{{.EXAMPLE}}", PREFIX: "example-{{base .EXAMPLE}}-{{.BAZEL_VERSION}}" } }
      - cd {{.EXAMPLE}} && ocx --project ../../ocx.toml exec -g test -- bazelisk test //... --verbose_test_summary

  # Windows without `--enable_runfiles`, the consumer default the examples now keep: deep:examples runs
  # examples/cross_platform:manifest_runfiles_test as is (V-L46). This runs it again in a workspace copy and an
  # output root whose paths hold non-ASCII characters (V-L47).
  deep:windows-runfiles:
    internal: true
    env:
      USE_BAZEL_VERSION: 9.x
    cmds:
      - cmd: |
          set -eu
          base="${RUNNER_TEMP:-{{.ROOT_DIR}}/e2e/.copies}/rules_ocx-ünïcødé"
          rm -rf "$base"
          mkdir -p "$base"
          cp -r examples/cross_platform "$base/"
          # The copy cannot reach the module through `../..`.
          echo 'common --override_module=rules_ocx={{toSlash .ROOT_DIR}}' >> "$base/cross_platform/.bazelrc.user"
          cd "$base/cross_platform"
          ocx --project "{{.ROOT_DIR}}/ocx.toml" exec -g test -- bazelisk --output_user_root="$base/bazel" \
            test --noenable_runfiles --verbose_test_summary //:manifest_runfiles_test //:host_test

  # ADR 0003 § Test plan `windows-update-target`: the generated update.bat, in workspace copies under a path with
  # a space. examples/package holds a tag and a pinned hub, examples/project a project hub with its ocx.lock.
  deep:windows-update-target:
    internal: true
    env:
      USE_BAZEL_VERSION: 9.x
      # The nested bazel call of the update program; the `bazel` it defaults to is not on PATH here.
      RULES_OCX_BAZEL: bazelisk
    cmds:
      - cmd: |
          set -eu
          base="${RUNNER_TEMP:-{{.ROOT_DIR}}/e2e/.copies}/rules_ocx update copies"
          rm -rf "$base"
          mkdir -p "$base"
          for example in package project; do
            cp -r "examples/$example" "$base/"
            # The copies cannot reach the module through `../..`; the rc line also reaches the nested call.
            echo 'common --override_module=rules_ocx={{toSlash .ROOT_DIR}}' >> "$base/$example/.bazelrc.user"
          done
          bz() { ocx --project "{{.ROOT_DIR}}/ocx.toml" exec -g test -- bazelisk "$@"; }
          # expect CODE TEXT ARGS...: `bazel ARGS` exits CODE and prints TEXT.
          expect() {
            want="$1"; text="$2"; shift 2
            set +e; out="$(bz "$@" 2>&1)"; got=$?; set -e
            printf '%s\n' "$out" | tail -n 30
            if [ "$got" != "$want" ]; then echo "expected exit $want, got $got: bazel $*" >&2; exit 1; fi
            if ! printf '%s\n' "$out" | grep -qF -- "$text"; then echo "expected '$text' from: bazel $*" >&2; exit 1; fi
          }

          cd "$base/package"
          # The first evaluation records the tag's fact; the update then finds it unchanged.
          bz mod deps --lockfile_mode=update
          expect 0 "rules_ocx: jq: unchanged" run @jq//:update
          expect 0 "rules_ocx: jq_pinned: pinned by digest in MODULE.bazel" run @jq_pinned//:update

          cd "$base/project"
          # ocx writes the lock without this comment, so its absence afterwards shows the file was replaced.
          echo '# rules_ocx: replaced by the update' >> ocx.lock
          # The nested bazel call prints one `rules_ocx: tools: ...` line per selected declaration; ocx itself prints none.
          expect 0 "rules_ocx: tools: " run @tools//:update
          if grep -qF '# rules_ocx: replaced by the update' ocx.lock || [ -L ocx.lock ]; then
            echo "bazel run @tools//:update did not replace ocx.lock with a file" >&2
            exit 1
          fi
          expect 64 "rules_ocx: an update argument holds one of" run @tools//:update -- -g "a&b"
          # `)` is not in E13's set: it must pass the argument capture and reach ocx, which refuses the group with 64.
          expect 64 "-g a)b failed (exit 64)" run @tools//:update -- -g "a)b"
          # @rules_ocx//:update takes declaration names: a known one is found, an unknown one is E1, and a name holding
          # a character cmd splits or acts on (space, tab, comma, semicolon, equals sign) is refused before any lookup.
          expect 0 "rules_ocx: tools: " run @rules_ocx//:update -- tools
          expect 64 "no ocx declaration is named 'nope'" run @rules_ocx//:update -- nope
          expect 64 "rules_ocx: an update argument holds one of" run @rules_ocx//:update -- "x y"
          expect 64 "any character outside A-Z a-z 0-9" run @rules_ocx//:update -- "x,y"
          expect 64 "any character outside A-Z a-z 0-9" run @rules_ocx//:update -- "x;y"
          expect 64 "any character outside A-Z a-z 0-9" run @rules_ocx//:update -- "x=y"
          expect 64 "rules_ocx: an update argument holds one of" run @rules_ocx//:update -- "a&b"
          expect 64 "any character outside A-Z a-z 0-9" run @rules_ocx//:update -- "a)b"
          (
            RULES_OCX_BAZEL="$base/no-such-bazel.exe"
            export RULES_OCX_BAZEL
            expect 78 "rules_ocx: no bazel found; put bazel on PATH or set RULES_OCX_BAZEL" run @tools//:update
          )
          # update.bat cannot follow a link, so a junction in a parent directory of ocx.lock is refused, and the
          # file behind it is left as it was.
          cp -r "{{.ROOT_DIR}}/examples/project" "$base/project_sub"
          echo 'common --override_module=rules_ocx={{toSlash .ROOT_DIR}}' >> "$base/project_sub/.bazelrc.user"
          cd "$base/project_sub"
          mkdir sub
          mv ocx.toml ocx.lock sub/
          printf 'exports_files(["ocx.lock", "ocx.toml"])\n' > sub/BUILD.bazel
          sed -i 's#"//:ocx\.#"//sub:ocx.#' MODULE.bazel
          bz mod deps --lockfile_mode=update
          mv sub "$base/outside_sub"
          MSYS2_ARG_CONV_EXCL='*' cmd /c mklink /J "$(cygpath -w "$base/project_sub/sub")" "$(cygpath -w "$base/outside_sub")"
          cp "$base/outside_sub/ocx.lock" "$base/before.lock"
          expect 78 "is a link on the path of the write target" run @tools//:update
          cmp "$base/before.lock" "$base/outside_sub/ocx.lock"
          echo "windows update target OK"

  # Reproduces the BCR presubmit for e2e/bzlmod. Deliberately no remote cache: a hit would hide a break
  # BCR would then find in the submission PR (e2e/ is its own workspace and does not import the baseline rc).
  deep:bcr-parity:
    internal: true
    cmds:
      - for: { var: BAZEL_VERSIONS }
        task: deep:bcr-build
        vars: { BAZEL_VERSION: "{{.ITEM}}" }
      - for: { var: BAZEL_VERSIONS }
        task: deep:bcr-rosetta
        vars: { BAZEL_VERSION: "{{.ITEM}}" }
        if: '{{and (eq OS "darwin") (eq ARCH "arm64")}}'

  deep:bcr-build:
    internal: true
    env:
      USE_BAZEL_VERSION: "{{.BAZEL_VERSION}}"
    dir: e2e/bzlmod
    cmds:
      - ocx --project ../../ocx.toml exec -g test -- bazelisk build //...

  # BCR's macOS agent is Intel: emulate darwin/amd64 with an x86_64 bazelisk under Rosetta (the repo-rule
  # host arch is the Bazel JVM arch, and `arch -x86_64` cannot downgrade the arm64 bazelisk from ocx).
  deep:bcr-rosetta:
    internal: true
    env:
      USE_BAZEL_VERSION: "{{.BAZEL_VERSION}}"
    dir: e2e/bzlmod
    cmds:
      - softwareupdate --install-rosetta --agree-to-license
      - curl -fsSL -o "${RUNNER_TEMP:-/tmp}/bazelisk-x64" https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-darwin-amd64
      - chmod +x "${RUNNER_TEMP:-/tmp}/bazelisk-x64"
      - arch -x86_64 "${RUNNER_TEMP:-/tmp}/bazelisk-x64" build //...

  # Offline failure mode; a network-backed cache would mask it. Linux only (one runner is enough). A set
  # repository vendors into a scratch OCX_HOME of its own, so there is no warm store an offline refetch
  # could reuse: it must fail naming ocx, never hang. That an offline build *succeeds* from `bazel vendor` or
  # blob_dirs is proven with the network cut, in the rig (verify-rbe: test_offline.py).
  deep:offline:
    internal: true
    cmds:
      - for: { var: BAZEL_VERSIONS }
        task: deep:offline-version
        vars: { BAZEL_VERSION: "{{.ITEM}}" }
        if: '{{eq OS "linux"}}'

  # One target, not `@dev_tools//...`: a tool the lock serves on another platform only (uvw is Windows-only)
  # has no toolchain on this one, and `//...` would analyse it.
  deep:offline-version:
    internal: true
    env:
      USE_BAZEL_VERSION: "{{.BAZEL_VERSION}}"
    cmds:
      - "{{.BAZEL}} fetch @dev_tools//:actionlint"
      - cmd: |
          # Offline, the fact is recomputed (the recorded one is not read with --lockfile_mode=off) and ocx
          # reports the package absent from the empty scratch home: `ocx vendor --manifest-only` exit 79.
          out=$(mktemp)
          if OCX_OFFLINE=1 {{.BAZEL}} fetch --force @dev_tools//:actionlint > "$out" 2>&1; then
            echo "expected the offline refetch without a store to fail" >&2
            exit 1
          fi
          if ! grep -q "ocx vendor --manifest-only for '.*' failed (exit 79)" "$out"; then
            echo "the offline refetch failed, but not as ocx vendor exit 79:" >&2
            tail -n 30 "$out" >&2
            exit 1
          fi
          echo "offline failure mode OK"

  # Copies every test.xml under DIR's bazel-testlogs to target/reports/junit/<PREFIX>-<path>.xml.
  junit:collect:
    internal: true
    cmds:
      - cmd: |
          out="{{.ROOT_DIR}}/target/reports/junit"; mkdir -p "$out"
          tl=$(cd {{.DIR}} && {{.BAZEL}} info bazel-testlogs 2>/dev/null) || exit 0
          # On Windows bazel prints C:\... ; the globs and the prefix strip below need the MSYS form.
          tl=$(cygpath -u "$tl" 2>/dev/null || printf '%s' "$tl")
          for f in "$tl"/*/test.xml "$tl"/*/*/test.xml "$tl"/*/*/*/test.xml "$tl"/*/*/*/*/test.xml "$tl"/*/*/*/*/*/test.xml; do
            [ -f "$f" ] || continue
            rel="${f#$tl/}"; rel="${rel%/test.xml}"
            cp "$f" "$out/{{.PREFIX}}-${rel//\//_}.xml"
          done

  release:bump-files:
    desc: "Rewrite the MODULE.bazel module version (called by release:prepare; VERSION=x.y.z)"
    requires:
      vars: [VERSION]
    cmds:
      # release.yml refuses to publish when the tag and MODULE.bazel disagree, so the module() version is
      # the one that has to move. Anchoring on a bare `version = "…",` line keeps bazel_dep() versions untouched.
      - |
        matches=$(grep -c '^[[:space:]]*version = "' MODULE.bazel)
        if [ "$matches" -ne 1 ]; then
          echo "MODULE.bazel: expected exactly one module version line, found $matches" >&2
          exit 1
        fi
        sed -i.bak 's/^\([[:space:]]*version = "\)[^"]*\(",\)$/\1{{.VERSION}}\2/' MODULE.bazel
        rm -f MODULE.bazel.bak

  lint:
    desc: buildifier + license headers + links + dist snapshot + guards (workflows are in task workflows:lint)
    cmds:
      - task: buildifier:check
      - ocx exec -g lint -- hawkeye check --fail-on-unknown
      # The ocx.sh/integrations/bazel/ link 404s until the site's first deploy and the edge flip;
      # drop the exclude then.
      - ocx exec -g lint -- lychee --no-progress --exclude '^https://ocx\.sh/integrations/bazel/' README.md CONTRIBUTING.md SECURITY.md
      # Guards the pin/snapshot lockstep invariant on every PR — the scheduled
      # update-dist.yml only checks it when it refreshes the snapshot itself.
      - task: dist:check
      # bump_ocx.py's supply-chain guards: setup.ocx.sh must not be able to
      # choose our pin, move it backwards, or rewrite a committed sha256.
      - python3 scripts/bump_ocx_test.py
      # A dev-ocx pin must not outlive its pull request: red on the default branch and in a merge group,
      # silent on a pull request (e2e/rbe/ocx-under-test.txt).
      - bash scripts/ocx_under_test.sh --guard
      - bash scripts/ocx_under_test_test.sh

  # make-location (buildifier >= 9) flags every `$(location)` in the examples and tests, so it stays off
  # until those call sites are migrated on purpose.
  buildifier:check:
    desc: buildifier format + lint check over every tracked Bazel file
    cmds:
      - git ls-files -z -- '*.bzl' '*.bazel' BUILD WORKSPACE | xargs -0 ocx exec -g lint -- buildifier -mode=diff -lint=warn -warnings=-make-location

  buildifier:fix:
    desc: buildifier format + lint fix over every tracked Bazel file
    cmds:
      - git ls-files -z -- '*.bzl' '*.bazel' BUILD WORKSPACE | xargs -0 ocx exec -g lint -- buildifier -mode=fix -lint=fix -warnings=-make-location

  format:
    desc: Apply buildifier and hawkeye formatting
    cmds:
      - task: buildifier:fix
      - ocx exec -g lint -- hawkeye format

  test:
    desc: Unit tests + docs freshness (no network)
    cmds:
      - "{{.BAZEL}} test //..."

  test:install-binary:
    desc: Local-ocx install path — hash check, copy, immunity to later edits (Linux only)
    cmds:
      - BAZEL=bazelisk ocx exec -g test -- bash e2e/install_binary/run.sh

  # A locally executed action gets no runfiles tree and no sandbox staging, so the launcher has only the runfiles
  # manifest (V-L48); `bazel coverage` starts the same tools (V-L49). Linux leg of C-RO-27.
  test:no-runfiles:
    desc: Vendored tools start without a runfiles tree and under bazel coverage (examples/cross_platform, Linux)
    dir: examples/cross_platform
    cmds:
      - defer: { task: junit:collect, vars: { DIR: examples/cross_platform, PREFIX: basic-no-runfiles } }
      - ocx --project ../../ocx.toml exec -g test -- bazelisk test --noenable_runfiles --spawn_strategy=local --verbose_test_summary //:manifest_runfiles_test
      - ocx --project ../../ocx.toml exec -g test -- bazelisk coverage --verbose_test_summary //:host_test //:manifest_runfiles_test

  test:examples:
    desc: Example workspaces — integration tests against live ocx.sh
    cmds:
      - for: { var: EXAMPLES }
        cmd: cd {{.ITEM}} && ocx --project ../../ocx.toml exec -g test -- bazelisk test //...

  site:install:
    desc: Install the site's dependencies from the committed lockfile
    dir: site
    cmds:
      - ocx exec -g docs -- pnpm install --frozen-lockfile

  site:build:
    desc: Build the Starlight site (ocx.sh/integrations/bazel/) from docs/
    deps: [site:install]
    dir: site
    cmds:
      - ocx exec -g docs -- pnpm run build

  site:check:
    desc: Build the site, then check its layout and the Stardoc anchors
    deps: [site:build]
    dir: site
    cmds:
      - ocx exec -g docs -- pnpm run check

  site:lighthouse:
    desc: Lighthouse 100x4 plus budgets on every built page (mobile, median of 3 on failure; needs Chromium)
    deps: [site:install]
    dir: site
    cmds:
      - ocx exec -g docs -- pnpm exec playwright-core install {{if env "CI"}}--with-deps {{end}}chromium
      - ocx exec -g docs -- pnpm run lighthouse

  site:test:
    desc: Offline unit test of the Lighthouse budgets and page discovery
    dir: site
    cmds:
      - ocx exec -g docs -- pnpm run test

  site:dev:
    desc: Live site at http://localhost:4321/integrations/bazel/
    deps: [site:install]
    dir: site
    cmds:
      - ocx exec -g docs -- pnpm run dev

  docs:update:
    desc: Regenerate stardoc API docs
    cmds:
      - "{{.BAZEL}} run //docs:update"

  dist:update:
    desc: Refresh dist/dist.json from setup.ocx.sh
    cmds:
      - python3 scripts/bump_ocx.py --snapshot-only
      - task: dist:check

  dist:check:
    desc: Snapshot sanity — only releases at or above the floor, pin present for all 8 targets (or the known empty state), per-row guards, no duplicate rows
    cmds:
      # The same code path the refresh validates with, so CI actually exercises
      # the per-row guards (stable channel, hex sha256, artifact host) and the
      # whole-file shape check (no (version, target) twice — select_release()
      # takes the first match) rather than a weaker second copy of them.
      - python3 scripts/bump_ocx.py --check
