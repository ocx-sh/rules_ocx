name: Deploy to ocx.sh

# Publishes the site at https://ocx.sh/integrations/bazel/. Only push to main, a daily run and a
# manual dispatch: no pull_request or tag trigger, the `ocx.sh` environment admits main only.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "ocx.toml"
      - "ocx.lock"
      - "taskfile.yml"
      - ".github/workflows/deploy.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup OCX
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: "0.6.2"
      - name: Build the site and check it
        run: ocx exec -- task site:check
      - name: Upload the build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ocx.sh
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: ocx-sh-deploy
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist
      - name: Deploy
        id: deploy
        uses: ocx-sh/website/.github/actions/deploy@1b898a76d4c3bbe60d9619a931c74f21660f4eb4 # v0.1.1
        with:
          dist: dist
          storage-key: ${{ secrets.BUNNY_STORAGE_KEY }}
