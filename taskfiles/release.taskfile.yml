# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Release preparation for the Bazel module. Mirrors ../grimoire-vscode's
# release:prepare, adapted to bzlmod: the version lives in MODULE.bazel
# (rewritten in place, there is no `npm version` equivalent). git-cliff
# computes the next version and regenerates CHANGELOG.md from conventional
# commits (config: cliff.toml — pre-1.0, so feat bumps minor and breaking
# does NOT bump major).

version: '3'

tasks:
  # Full release preparation: compute next version, bump MODULE.bazel,
  # regenerate CHANGELOG.md, run verify. After this succeeds, the human
  # reviews and commits.
  #
  # Version selection:
  #   task release:prepare                 # interactive menu: auto | patch | minor | major
  #   task release:prepare BUMP=minor      # skip the menu, force a bump level
  #   task release:prepare BUMP=auto VERSION=1.4.0   # pin an exact version (v prefix optional)
  #
  # BUMP is a required enum: with interactive mode on (.taskrc.yml) and a TTY it
  # renders a selection menu; on CI / no TTY it must be passed on the CLI.
  prepare:
    desc: 'Prepare a release (interactive: pick auto|patch|minor|major; or BUMP=<level> / VERSION=x.y.z)'
    requires:
      vars:
        - name: BUMP
          enum: [auto, patch, minor, major]
    vars:
      # git-cliff computes the next version from git history. `auto` lets it pick
      # the bump from conventional commits; otherwise BUMP forces the level.
      # VERSION pins an exact value and wins over BUMP.
      NEXT_VERSION:
        sh: |
          if [ -n "{{.VERSION}}" ]; then
            printf 'v%s' "{{.VERSION | default "" | trimPrefix "v"}}"
          elif [ "{{.BUMP}}" = "auto" ]; then
            ocx run -- git-cliff --bumped-version
          else
            ocx run -- git-cliff --bumped-version --bump "{{.BUMP}}"
          fi
    cmds:
      - echo "Next version:{{.NEXT_VERSION}}"
      # release.yml refuses to publish when the tag and MODULE.bazel disagree,
      # so the module() version is the one that has to move. Anchoring on a
      # bare `version = "…",` line keeps bazel_dep() versions untouched.
      - |
        matches=$(grep -c '^[[:space:]]*version = "' MODULE.bazel)
        if [ "$matches" -ne 1 ]; then
          echo "MODULE.bazel: expected exactly one module version line, found $matches" >&2
          exit 1
        fi
        sed -i 's/^\([[:space:]]*version = "\)[^"]*\(",\)$/\1{{.NEXT_VERSION | trimPrefix "v"}}\2/' MODULE.bazel
      - ocx run -- git-cliff --tag "{{.NEXT_VERSION}}" -o CHANGELOG.md
      - task verify
      - |
        echo ""
        echo "Release prepared ({{.NEXT_VERSION}}). Review changes, then:"
        echo "  git add -A && git commit -m 'chore(release): {{.NEXT_VERSION}}'"
        echo "  git tag {{.NEXT_VERSION}}"
        echo "  git push --atomic origin main {{.NEXT_VERSION}}"
